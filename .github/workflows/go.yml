# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Whatever Go currently calls stable, which has to be at least the
        # version in go.mod.
        go-version: 'stable'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -v ./...

    # A short run over both fuzz targets, enough to catch a corpus entry that
    # has stopped passing. The long runs belong on a laptop, not in CI.
    - name: Fuzz
      run: |
        go test -run xxx -fuzz FuzzTree -fuzztime 30s .
        go test -run xxx -fuzz FuzzKeyValueStore_Data -fuzztime 30s .
