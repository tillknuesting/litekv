# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Whatever Go currently calls stable, which has to be at least the
        # version in go.mod.
        go-version: 'stable'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # go fix rewrites rather than reports, so the check is to run it and see
    # whether anything moved. It applies the modernisers — a C-style loop that
    # could be `for i := range n`, an if-and-assign that is `min` or `max`, an
    # Add/go/defer Done that is `WaitGroup.Go` — and every one of those is a
    # change to code that is under test, so it belongs in front of a person
    # rather than in a commit somebody rubber-stamped.
    #
    # --exit-code fails the build and prints the diff, which is the part that
    # makes the failure actionable: `go fix ./...` locally, read it, commit it.
    - name: Fix
      run: |
        go fix ./...
        git diff --exit-code

    - name: Test
      run: go test -race -v ./...

    # A short run over each fuzz target, enough to catch a seed that has
    # stopped passing. The long runs belong on a laptop, not in CI, and the
    # corpus a long run builds up stays on that laptop: CI starts from the
    # seeds in the code every time.
    #
    # Naming a target that does not exist is not an error to the go tool, only
    # a warning, so a stale name here fuzzes nothing and says so quietly: check
    # the names against the FuzzXxx functions in the tests when adding one.
    - name: Fuzz
      run: |
        go test -run xxx -fuzz FuzzKeyValueStore_Data -fuzztime 30s .
        go test -run xxx -fuzz FuzzSegmentBytes -fuzztime 30s .
        go test -run xxx -fuzz FuzzHint -fuzztime 30s .
        go test -run xxx -fuzz FuzzKeyValueStore_WriteReadDelete -fuzztime 20s .
        go test -run xxx -fuzz '^FuzzApply$' -fuzztime 30s .
        go test -run xxx -fuzz '^FuzzDBApply$' -fuzztime 30s .
        go test -run xxx -fuzz '^FuzzDBApplySnapshot$' -fuzztime 30s .
        go test -run xxx -fuzz '^FuzzDBSince$' -fuzztime 20s .
        go test -run xxx -fuzz '^FuzzDBPosition$' -fuzztime 20s .
